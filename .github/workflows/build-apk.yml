name: Build APK

on:
  push:
    branches: [main, api36-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/RetroPricer-v2.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RetroPricer-debug-apk
          path: out/RetroPricer-v2.0-debug.apk

      - name: Publish to a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-debug-${{ github.run_number }}
          name: RetroPricer v2.0 debug build ${{ github.run_number }}
          prerelease: true
          files: out/RetroPricer-v2.0-debug.apk
